# WJ-OS 支柱定义字典（机读版）
# 权威来源：spec/v2_方案.md §13（支柱定义字典·执行基线 v1.0）；与其他章节冲突时以 §13 为准（§13.0 规则 1）。
# 本文件是机读投影，文字与 §13.1/§13.2/§13.3 一字不差地对应；如需修改走 v2 §15.13 变更控制，不得静默改（§13.0 规则 3）。
# 验收：一级恰好 10 个、二级恰好 25 个；逐柱 L2 数与 L3 预算等于 §13.1 总览表。

meta:
  dictionary: WJ-OS 支柱定义字典
  version: "v1.0"
  date: "2026-10-24"
  authoritative_source: "wujun-os/spec/v2_方案.md §13（§13.1 总览、§13.2 一级定义、§13.3 二级定义）"
  change_control: "大变更（增删并改一二级、改规则①–⑫、改红线、改排除准则）必须用户批准（v2 §15.13、constraints.md HC-22）"
  quantity_tiers:
    note: "三档数值待用户确认★2，默认生效（constraints.md HC-06：你要求放宽，三档数值待你确认）"
    l2: { target: "22-28", warning: 28, redline: 32 }
    l3: { target: "32-44", warning: 44, redline: 50 }
    v0_baseline: { l2: 25, l3_budget: 37 }
    treatment: { warning: "到预警线须在 P4 书面说明新增理由与证据", redline: "超出红线须用户批准" }
  acceptance:
    l1_count: 10
    l2_count: 25
    l2_count_per_pillar: { D01: 4, D02: 4, D03: 2, D04: 3, D05: 2, D06: 3, D07: 2, D08: 2, D09: 2, D10: 1 }
    l3_budget_per_pillar: { D01: 6, D02: 6, D03: 3, D04: 4, D05: 3, D06: 5, D07: 3, D08: 3, D09: 2, D10: 2 }
  usage_rules_ref: "v2 §13.0 使用规则 10 条：判据一律结论句测试（规则4）；素材线索只作分诊参考不作归属依据（规则6）；每卡主归属唯一、辅助标签≤2、能力标签 0–2 且不参与归属（规则7）；吴军本人判断与第三方转述必须分开（规则8）；重点三柱 D01/D02/D06 深加工（规则9）"
  structure_note: "手册第二篇对内篇=第1–4章（D01–D04），第三篇对外篇=第5–10章（D05–D10）；章号=支柱码序号（§13.1）"

pillars:
  - id: D01
    name: 认知格局与境界哲学
    category: 对内
    focus: true
    definition: 如何认识世界、如何思考，以及看事情的尺度、层次与哲学视角
    l2_count: 4
    l3_budget: 6
    manual_chapter: 第 1 章
    processing_tier: 深加工层
    core_question: 我怎样才能想得更清楚、看得更远、站得更高？
    includes: 认识世界与获得新知的方法；理性与经验及其适用条件；推理、证伪、怀疑、真伪辨别；看问题的尺度、视野，大局与小利的取舍观；认知与人生层次的提升；哲学思想（理性主义、经验主义、尼采、维特根斯坦、亚里士多德等）及吴军的评述与取用
    excludes_to: 面对具体选择的取舍 → D03；数学、计算机、工程原理本身 → D04；个人三观的形成与安放 → D02-3；学习方法 → D02-2；哲学家生平与思想史科普 → X4（只留吴军的可迁移评述）
    criterion: 结论句回答"世界、知识、思考是怎样的，该怎样认识与思考"，或"看事情应取什么尺度、什么层次"
    boundary_rules: [④″, ⑦, ⑩]
    subs:
      - id: D01-1
        name: 认知·如何思考（理性与科学方法）
        definition: 如何认识世界、获得新知、判断真伪、进行思考，含理性与科学方法。问：我怎样想才不被误导、得出可靠的结论？
        includes: 如何知道所见非虚；理性主义与经验主义的含义和局限；何时用经验、何时信理性；推理类型（含充分性推理）与逻辑的预见性；发现真理的系统方法；证伪与怀疑；辨别信息真假、走出认知的洞穴；用逻辑过滤信息和结论；思维方式的训练
        excludes_to: 数学、计算机、工程的原理与方法 → D04（⑩）；面对具体选择的取舍 → D03（⑦）；学习方法 → D02-2；哲学家学说本身 → D01-4
        caliber_boundary: 结论句讲"怎样认识、推理、判真伪、选思维框架"归本簇；通用推理归本簇，数学原理归 D04-1。"经历与经验"类按 §13.4 第 5 行判定
        material_clues: 境界《我们如何知道自己所见非虚》《我们为何能对客观世界作出准确判断》《我们该选择理性还是经验》《理性主义思维究竟是什么》《何为逻辑的预见性》《有没有系统发现真理的方法》《充分性推理：凡事有果必有因吗》《经验靠得住吗》《何时使用经验，何时相信理性》；富足第六章《不要把幻象当作现实》《走出认知的洞穴》《辨别信息真假的有效手段》；态度《证伪比证实更重要》《做理性的怀疑者》；来信1 第 258 封《训练好的思维方式——证伪比证…》、第 260 封《使用逻辑过滤信息和结论》；来信3 第 032 封《什么时候用经验主义，什么时候…》
        must_check_topics:
          - ① 知道与确信的来源
          - ② 理性与经验的含义、局限与适用条件
          - ③ 推理与逻辑
          - ④ 发现真理的方法与证伪
          - ⑤ 辨别真伪与信息过滤
          - ⑥ 常识的使用与更新
        ability_tags: [思]
        risks: 体量预期较大，不预期触发薄簇；注意回归组 e（经验与理性不得写成"经验永远比理性重要"）
      - id: D01-2
        name: 格局
        definition: 看事情的尺度、视野与取舍的大局观（工作定义，P1 校准）。问：我怎样站在更大的尺度上看事情、做取舍？
        includes: 大局与小利、小恶与大善的权衡；决策时的格局；主动、分享利益与独立判断的格局观；眼光、高度与量级之差
        excludes_to: 具体选择的取舍判断 → D03-1；职场沟通与职业技巧 → D06；交友与合作方法 → D07-2；未来趋势预测 → X6
        caliber_boundary: 结论句讲"应取多大尺度、多高层次、大局与小利"归本簇；讲"做或不做某具体事"归 D03-1；与 D07-2 在"分享利益"上按结论句分
        material_clues: 格局第一章《上帝只垂青主动的人》《在没有听到反对意见之前不要贸然行事》《分享利益，独立决定》《不要因为小恶而忘记大善》；第五章《见小利，则大事不成》《一张纸决定我们的高度》《拥有智慧，更要拥有勇气》；态度《决策时格局要大》；谷歌《来信补充丨决策时格局要大》
        must_check_topics:
          - ① 大局与小利、小恶与大善
          - ② 格局与决策
          - ③ 主动、分享与独立判断
          - ④ 量级与高度
        ability_tags: [思]
        risks: 与 D03-1、D07-2 重叠度高，靠结论句测试和判例；格局一词在不同书里的用法需 P1 核对
      - id: D01-3
        name: 境界
        definition: 认知与精神的层次、人生维度，以及超越庸常的路径（工作定义，P1 校准）。问：怎样提升认知与人生的层次？
        includes: 什么是境界；了解自己与世界（自我的边界、对灵魂问题的吴军评述）；做事的境界；超越庸常生活成为"更高的人"（吴军对其的取用）
        excludes_to: 尼采等第三方思想本身 → D01-4；心态与幸福 → D02-4；具体做事方法 → D05
        caliber_boundary: 结论句讲"认知与人生所处的层次、如何提升"归本簇；第三方思想本身归 D01-4，吴军对其取用归本簇
        material_clues: 境界《前言 什么是境界》《自我的边界在哪里》《如何审视自己和他人》《人如何依据本性过理性的生活》；第四篇《超越庸常生活，成为"更高的人"》；态度《做事时境界要高》
        must_check_topics:
          - ① 境界的含义与层次
          - ② 自我与世界的认识
          - ③ 超越庸常的路径
          - ④ 境界与做事、决策的关系
        ability_tags: [思]
        risks: 素材集中在境界和态度，需确认来源 ≥2 本书；否则触发薄簇条款
      - id: D01-4
        name: 哲学
        definition: 哲学思想与流派，以及吴军对其的评述与取用。说话人多为"转述·第三方"。问：这些思想说了什么，吴军如何评价并取用？
        includes: 理性主义、经验主义、尼采、维特根斯坦、亚里士多德、苏格拉底、庄子、伊壁鸠鲁、吠陀文化、叔本华等的思想要点（转述）及吴军的评述；哲学的作用与边界
        excludes_to: 哲学家生平与思想史科普 → X4（只留吴军评述）；吴军自己的认知方法 → D01-1；文学人物智慧（如莎士比亚）→ 先写结论句再归属，纯赏析 → X8
        caliber_boundary: 说话人为"转述·第三方"的内容只进卡的"转述"字段，不进"原著核心判断"；入主干的只能是吴军的评述与取用
        material_clues: 境界第五篇《维特根斯坦的哲学有何突破》《语言的极限就是世界的极限吗》《哲学"终结"了吗》；第四篇《如何理解尼采的思想》《"上帝死了",人该怎么办》；来信1 第 167 封《对话庄子1：谈谈见识》；来信3 第 113 封《亚里士多德的智慧1：如何在个…》；来信2《叔本华告诉你，为什么苏格拉底会被处死》
        must_check_topics:
          - ① 主要哲学思想的要点（转述）
          - ② 吴军的评述与取用
          - ③ 哲学的作用与边界
        ability_tags: [思]
        risks: 伪原著风险最高，强制三色标注（原著 / 转述 / 整合者推断）

  - id: D02
    name: 个人成长与世界观/人生观/价值观（含心态韧性与幸福生活）
    name_in_13_1_table: 个人成长与世界观/人生观/价值观
    category: 对内
    focus: true
    definition: 一个人如何成长、学习，如何形成、校准并安放三观，如何保持心态与幸福
    l2_count: 4
    l3_budget: 6
    manual_chapter: 第 2 章
    processing_tier: 深加工层
    core_question: 我怎样成为什么样的人，并把自己安放好？
    includes: 成长经历与心路中可迁移的判断；学习方法；三观的形成、校准与安放（我信什么、什么重要、怎样看命运与运气）；情绪、压力、逆境下的状态稳定；乐观与悲观；幸福的含义与来源；生活节奏与休息
    excludes_to: 把一件具体事做成 → D05；认识世界的方法框架 → D01；职业发展 → D06；教育制度、升学、家庭与亲密关系 → X5；没有可迁移判断的个人轶事 → C 或 X8
    criterion: 结论句回答"我经历了什么、怎样形成和校准信念与价值、怎样安放自己与保持状态、怎样学"
    boundary_rules: [①, ④″, ⑧, ⑪]
    subs:
      - id: D02-1
        name: 成长经历与心路
        definition: 吴军本人及其所述人物的成长经历、阶段选择与心路中可迁移的判断。问：经历怎样塑造了判断，我能迁移什么？
        includes: '"经历 → 判断"的论述（恩师、读书、写书心得、人生感悟、阶段选择）；把经历变成经验的方法'
        excludes_to: 纯个人轶事、游记 → X3 或 X8；如何做复盘 → D05-2；经验与理性的关系 → D01-1；家庭与亲子 → X5
        caliber_boundary: 只收"经历 → 可迁移判断"；没有判断的纯叙述不成 K 卡，记 C 或 X8
        material_clues: 格局《我的 5 位恩师》；来信1 第 071 封《我的写书心得…》、第 112 封《我的读书笔记1…》；来信2《我的 2024 年人生感悟》；富足《17. 经历不等于经验》《22. 点石成金：变经历为经验》
        must_check_topics:
          - ① 重要经历与由此得到的判断
          - ② 恩师与读书对判断的影响
          - ③ 经历变经验的方法
        ability_tags: []
        risks: 个人叙事易膨胀，须严格执行"经历 → 判断"口径；薄簇风险：中
      - id: D02-2
        name: 如何学习（学习方法）
        definition: 如何获取、消化、记忆、迁移知识的方法；不含教育制度与"为什么学"。问：我怎样学得更有效？
        includes: 手先于脑与脑先于手的学习、信息学习与传递的效率、读书与阅读的方法、学以致用、数学该怎么学（方法层面）、跳出问题看问题（学习方法层面）
        excludes_to: 为什么学、学什么、读书的意义 → D02-1 或 D02-3（⑪）；教育制度、升学、大学与专业选择 → X5（含方法论例外）；通用思考方法 → D01-1
        caliber_boundary: 结论句讲"怎样学、怎样提高学习效率"归本簇
        material_clues: 富足《23. 手先于脑，有效学习》《24. 脑先于手，理性思考》《27. 学会跳出问题看问题》；数学通识《发刊词｜数学到底应该怎么学？》；来信2《香农第二定律：怎样提高信息学习和传递的效率？》
        must_check_topics:
          - ① 先动手还是先动脑地学
          - ② 提高学习与信息传递效率
          - ③ 读书与阅读的方法
          - ④ 学以致用
        ability_tags: [学]
        risks: 本包粗筛偏薄（标题命中 38、正文高密度 31，多数是"为什么学"），最可能触发薄簇条款，届时降级为 D02 下的 L3 加"学"标签
      - id: D02-3
        name: 三观的形成、校准与安放
        definition: 世界观、人生观、价值观的形成、校准与安放：我信什么、什么重要、怎样看命运与运气、怎样活。问：我的信念与价值怎样形成、校准、安放？
        includes: 价值观（含做人原则、问心无愧）；人生观（人生是一条河、向死而生、人生最重要的投资）；命运观（命与运、尽人事听天命、对运气的看法）；意义；金钱以外的价值取舍；个人所持的世界信念
        excludes_to: 世界运行逻辑与认识方法 → D01；金钱观中的财富管理 → D09-1；把运气或概率当决策输入 → D03-2；教育改变命运类 → X5
        caliber_boundary: 本簇的"世界观"指个人所持的信念及其校准，与 D01 的"认识世界的方法"区分（④″）。命运观与概率决策见 §13.4 第 11 行
        material_clues: 格局《问心无愧是稳得的报酬》《尽人事，仍需听天命》；见识《序言"命"和"运"决定人的一生》《人生是一条河》《这个世界没有欠你什么》《向死而生》《论运气》；态度《态度决定命运》《更重要的是做个好人》；来信2 回用户信 05《生命如此短暂，意义究竟何在？》
        must_check_topics:
          - ① 价值观与做人原则
          - ② 人生观与人生阶段
          - ③ 命运观与对运气的看法
          - ④ 意义与金钱以外的取舍
        ability_tags: []
        risks: 与 D01 的"世界观"字眼易混，按④″判；与 D03-2 在运气上易混，按 §13.4 第 11 行判
      - id: D02-4
        name: 心态韧性与幸福生活
        definition: 情绪、压力、逆境下的状态稳定，乐观与悲观，以及幸福与生活节奏。问：怎样在压力与逆境中保持状态、过得幸福？
        includes: 乐观的人生态度、幸福的来源与含义、抵制诱惑的定力、悲观主义的盛行与危害、怀旧、休息与生活节奏、幸福的蓝色地带、不选择的幸福、快乐
        excludes_to: 如何把事做成 → D05；人生价值与意义 → D02-3；医学与心理疾病诊断类 → X8；亲子教育中的快乐教育 → X5
        caliber_boundary: 结论句讲"状态稳定、乐观悲观、幸福"归本簇（⑧）
        material_clues: 态度《乐观的人生态度比什么都重要》《幸福的来源》《如何拥有抵制诱惑的定力》；格局第七章《为什么悲观主义会盛行》《悲观主义的危害》《我们为什么怀旧》、第三章《要思考，就需要慢下来》《不要成为积极的废人》《懂得休息，才能更好地生活》《幸福的蓝色地带》；见识第七章《幸福是目的，成功是手段》；来信1 第 117 封《不选择的幸福》；来信2《人怎样过得快乐？》；谷歌《幸福的含义》
        must_check_topics:
          - ① 乐观与悲观
          - ② 幸福的含义与来源
          - ③ 定力与抵制诱惑
          - ④ 生活节奏与休息
        ability_tags: []
        risks: 不得写成医学或心理治疗建议

  - id: D03
    name: 判断决策与风险止损
    category: 对内
    focus: false
    definition: 面对具体选择时做什么、不做什么，以及风险、概率与止损
    l2_count: 2
    l3_budget: 3
    manual_chapter: 第 3 章
    processing_tier: 覆盖层
    core_question: 这件事我该不该做、选哪个、何时停？
    includes: 决策框架；成本与机会成本；做减法的取舍判断；优先级取舍；期望值与收益函数；风险意识；止损；概率与大概率判断（作为决策输入）；不确定性下的选择；决策层面的红线
    excludes_to: 确定做之后怎么做 → D05；概率与统计的数学原理本身 → D04-1；投资的具体原则与红线 → D09-2；命运观（命与运怎么看）→ D02-3；认识世界的方法 → D01
    criterion: 结论句回答"做不做、选哪个、何时停、承担多大风险"
    boundary_rules: [②, ⑦]
    subs:
      - id: D03-1
        name: 决策框架与取舍
        definition: 面对具体选择时，做什么、不做什么的判断框架与取舍。问：这件事该不该做、选哪个、先做哪个？
        includes: 决策前考虑成本；让回报大于成本；机会成本；做减法的取舍判断；西瓜与芝麻；优先级取舍（最重要的事先做）；体量与取舍；选择与不做选择
        excludes_to: 确定做之后怎么做 → D05（②）；风险、概率、止损 → D03-2；格局层面的大局观 → D01-2；价值观层面的人生取舍 → D02-3
        caliber_boundary: 结论句含"做、不做、选哪个、先后"归本簇；"做减法"按主干判（回归组 b）
        material_clues: 富足第二章《08. 做决定前，先考虑成本》《09. 如何让回报大于成本》、第一章《03. 做减法比做加法重要》；见识《西瓜与芝麻》《不做选择的幸福》；来信1 第 021 封《西瓜与芝麻》；来信3 第 129 封《迎接未来3：怎么理解"选择"》；谷歌《2017年所做的减法》；态度《捡最重要的事先做》
        must_check_topics:
          - ① 成本、回报与机会成本
          - ② 做减法与西瓜芝麻
          - ③ 优先级
          - ④ 选择的代价
        ability_tags: [思]
        risks: 与 D05 的边界是规则②，与 D01-2 的边界靠结论句
      - id: D03-2
        name: 风险、止损与概率思维
        definition: 风险意识、止损、概率与大概率判断、不确定性下的决策。问：该承担多大风险、何时止损、怎样看待概率？
        includes: 期望值最大化与收益函数；风险意识；承担多大风险；止损（含时间管理中的止损）；大概率事件与黑天鹅的决策含义；不确定性下的取舍；做事前不要过分算概率；决策层面的红线
        excludes_to: 概率与统计的数学原理 → D04-1；投资的具体风险与红线 → D09-2；命运观 → D02-3；保险与金融产品细节 → D09-2 或 X8
        caliber_boundary: 结论句讲"风险、止损、把概率用于决策"归本簇；讲概率本身的数学规律归 D04-1
        material_clues: 格局《舍得止损，才能斩断厄运》；见识《风险意识》《期望值最大化原理：设置好收益函数》；态度《做事前不要过分算概率》；来信1 第 018 封《期望值最大化原则和它在生活上…》、第 141 封《风险意识》；来信3 第 067 封《我们应该承担多大的风险？》；来信2 周末问答 31《遇到困境，及时止损还是继续坚持》
        must_check_topics:
          - ① 期望值与收益函数
          - ② 风险意识与承担
          - ③ 止损
          - ④ 大概率与不确定性下的决策
        ability_tags: [思]
        risks: 回归组 f（认命、大概率）要读正文定条件

  - id: D04
    name: 数理与计算机思维与工程思维
    category: 对内
    focus: false
    definition: 数学、计算机、工程的原理与思维方式本身
    l2_count: 3
    l3_budget: 4
    manual_chapter: 第 4 章
    processing_tier: 覆盖层
    core_question: 这些学科的思维方式是什么，它说明了什么规律？
    includes: 数学思维（极限、无穷、数列与级数、函数、微积分、线性代数、概率统计与博弈论的原理）；计算机思维（算法、搜索、数据、信息、量级、计算的局限）；工程思维（极限与误差、基线、系统性、奥卡姆剃刀、试错、精度）
    excludes_to: 在工程场景怎么把事做成（三条边的应用）→ D05-1，加辅助标签[工程]；通用思考方法 → D01-1；概率用于决策 → D03-2；数学史、数学家轶事 → X4（保留可迁移方法论）
    criterion: 结论句讲"某学科的原理或思维方式本身"；讲"怎么做事"归 D05，讲"怎么选"归 D03
    boundary_rules: [③, ⑩]
    manual_note: 数理映射规范（§5.9）主要用于本章
    subs:
      - id: D04-1
        name: 数学思维与极限
        definition: 数学的原理与思维方式本身：极限、无穷、数列级数、函数、微积分、线性代数、概率统计、博弈论等，及其说明的规律。问：数学思维说明了什么规律？
        includes: 用数学思维认识世界的原理层（负数、乘方、线性增长的局限、杠杆、级数与利息月供）；极限与无穷小；函数与因果；向量与维度；微积分；概率与统计原理；零和与非零和博弈原理；数学与哲学、逻辑、科学的关系
        excludes_to: 概率用于决策 → D03-2；用数学工具做事的步骤 → D05；数学史、数学家轶事 → X4（保留可迁移方法论）；把数学类比到生活取舍 → 按结论句判（讲原理归本簇，讲取舍归 D03）
        caliber_boundary: 结论句讲"数学的某个原理或规律"归本簇
        material_clues: 数学通识全书第 02–50 讲；富足第一章《01. 做事永远不要忽视负数》《02. 你与亿万富翁的距离》《06. 线性成长的局限性》《07. 用乘方思维扩大影响力》；来信3 第 105 封《数学思维1：为什么总觉得自己…》；来信1 第 242 封《数学史上的公案——无理数》（史实，多半 X4）
        must_check_topics:
          - ① 极限与无穷小
          - ② 数列、级数与增长
          - ③ 函数与因果
          - ④ 概率与统计原理
          - ⑤ 博弈论原理
          - ⑥ 数学与逻辑、哲学的关系
        ability_tags: [思]
        risks: 数理映射（§5.9）主要在本簇；涉及公式、图表的卡标"以正文为准"
      - id: D04-2
        name: 计算机思维
        definition: 计算机与信息领域的思维方式：算法、搜索、数据、信息、量级、计算的局限，及其说明的规律。问：计算机思维是什么，它说明了什么规律？
        includes: 计算机思维的含义；算法与效率的本质；搜索与数据；信息与比特；计算的局限（计算机不是万能）；机器与人的分工；数据资产（技术层面）
        excludes_to: 在工作场景中怎么用计算机思维做事 → D05-1，加辅助标签[计算机]；AI 与科技趋势预测 → X6；技术史 → X4；具体产品评测与技术细节 → X8
        caliber_boundary: 结论句讲"计算机或信息领域的原理与思维方式本身"归本簇，类比规则③
        material_clues: 谷歌《答读者问01丨什么是计算机思维》《为什么计算机不是万能的》《从计算机的算法，谈谈提高效率的本质》《什么是好的计算机算法？对效率影响有多大？》；来信3 答读者问 13《搜索引擎很强大，还需要自己思考…》；谷歌作者自编目录的"计算机思维"模块（条数待 P0 核对）
        must_check_topics:
          - ① 计算机思维的含义
          - ② 算法与效率
          - ③ 搜索与数据
          - ④ 信息
          - ⑤ 计算的局限
        ability_tags: [思]
        risks: 与 D05-1、D01-1 的边界易混，按规则③⑩判
      - id: D04-3
        name: 工程思维
        definition: 工程的原理与思维方式：极限、误差、基线、系统性、奥卡姆剃刀、试错、精度。问：工程思维的原理是什么？
        includes: 工程思维：直觉和极限；极限与误差；基线与连接路径的概念本身；系统思维；奥卡姆剃刀（简单成就高效）；科学试错；可靠性
        excludes_to: '"三条边"在工程场景中怎么把事做成 → D05-1（③），辅助标签[工程]；具体工程案例史 → X4；工程师职业分级 → D06-1'
        caliber_boundary: 三条边 = 基线、极限、连接路径（已用谷歌第 008 封信核实，不是成本、质量、时间三角）；原理归本簇，应用归 D05-1
        material_clues: 谷歌《工程思维：直觉和极限》《把事情做好的三条边》；格局《把事情做好的"三条边"》；富足《40. 学会用系统思维看问题》《41. 奥卡姆剃刀原则：简单成就高效》；来信2《奥卡姆剃刀原理：为什么说简单的解释比复杂的好》；来信3 第 071 封《如何运用系统性和科学试错的方法…》
        must_check_topics:
          - ① 极限与误差
          - ② 基线与连接路径（原理）
          - ③ 系统思维
          - ④ 奥卡姆剃刀
          - ⑤ 科学试错
        ability_tags: [思]
        risks: 回归组 c；与 D05-1 靠规则③互设辅助标签

  - id: D05
    name: 做事方法与执行力
    category: 对外
    focus: false
    definition: 确定要做之后，怎样把事做成，并持续执行与复盘
    l2_count: 2
    l3_budget: 3
    manual_chapter: 第 5 章
    processing_tier: 覆盖层
    core_question: 我已经决定做，怎么做成、怎么坚持、怎么复盘？
    includes: 做事的路径与原则（三条边的应用、先动手还是先动脑、关键路径与替代方案、做好最后的 1%、专注、笨办法）；执行与坚持（作为把事做成的手段）；可叠加的进步的做法；复盘；OKR 的通用执行环节
    excludes_to: 做什么、不做什么 → D03；长期积累能力与学习 → D02；极限、误差等工程原理 → D04-3；职场场景下的效能 → D06；创新与产品方法 → D10
    criterion: 结论句回答"确定要做之后怎么做、怎么坚持、怎么复盘"
    boundary_rules: [①, ②, ③, ⑨]
    subs:
      - id: D05-1
        name: 做事路径与原则
        definition: 确定要做之后，把事做成的路径与原则。问：已决定做，路径是什么、原则是什么？
        includes: 三条边的应用（基线 → 极限 → 路径）；先动手还是先动脑；关键路径与替代方案；做好最后的 1%；笨办法与专注；永远寻找更好的方法；做大事与做小事的心态（做事层面）；行动与吸取教训
        excludes_to: 做不做、先后取舍 → D03-1；极限、误差原理 → D04-3；复盘与坚持 → D05-2；长期能力积累 → D02；职场场景化 → D06
        caliber_boundary: 结论句回答"确定要做之后怎么做"归本簇（①②③）
        material_clues: 格局《把事情做好的"三条边"》《如何脱离低水平勤奋》；富足第四章《25. 太初有为：行动才是答案》《26. 问题的解决，不只靠脑子》、第五章《31. 关键路径和替代方案》《32. 做大事和做小事的心态》；态度《永远寻找更好的方法》；来信1 第 083 封《瑞士制造的智慧——做好最后的…》；来信2《伟大是如何炼成的：做好自己的事》
        must_check_topics:
          - ① 三条边的应用
          - ② 先动手与先动脑
          - ③ 关键路径与替代方案
          - ④ 做好最后的 1%
          - ⑤ 专注与更好的方法
        ability_tags: [做]
        risks: 与 D03-1（规则②）、D04-3（规则③）、D06-2（场景化）的边界是重点
      - id: D05-2
        name: 执行与复盘
        definition: 把事持续执行下去、可叠加地进步，并复盘。问：怎样坚持执行、持续进步、做好复盘？
        includes: 可重复的成功；可叠加的进步的做法；不怕慢就怕停；坚持与长期主义（执行层面）；复盘；习惯的落实（服务于具体事）；OKR 作为通用执行与复盘工具；小习惯
        excludes_to: 习惯作为"长期积累能力"的论述 → D02（①）；职场目标管理的职场场景论述 → D06-2；学习方法 → D02-2
        caliber_boundary: 结论句讲"怎么把事持续做下去、怎么复盘"归本簇；见 §13.4 第 7 行
        material_clues: 富足《13. 不怕慢，就怕停，更怕反复》《14. 可重复的成功》《15. 可叠加的进步》《19. 如何做好有效复盘》；态度《好习惯成就一生》；来信1 第 179 封《我对 2017 Q1 OKR…》；来信2《积分的延迟效应：为什么要坚持长期主义？》；来信3 第 028 封《为什么小习惯最值得改变？》
        must_check_topics:
          - ① 可重复的成功与可叠加的进步
          - ② 坚持与长期主义
          - ③ 复盘
          - ④ 习惯的落实
        ability_tags: [做]
        risks: 回归组 a：可叠加不等于复利，与"可重复的成功""考拉与袋鼠"需分别核验

  - id: D06
    name: 职业与职场
    category: 对外
    focus: true
    definition: 职业选择与发展、职场效能，以及职场中的关系与上下级
    l2_count: 3
    l3_budget: 5
    manual_chapter: 第 6 章
    processing_tier: 深加工层
    core_question: 在职场里怎样选路、做出成果、处好关系？
    includes: 职业选择、第一份工作、职业分级与发展路径、职业天花板与量级、职业阶段议题；伪工作与有效工作、10000 小时的辨析、目标管理在职场的应用、做好最后的 1%（职场场景）；好老板、向上管理、服从与领导、识别和防范职场小人；面试与求职
    excludes_to: 通用沟通机制 → D07-1；任何场景下的合作与信任 → D07-2；通用做事方法 → D05；企业经营与创业 → D08；教育与升学 → X5
    criterion: 结论句"以职业发展、职场成果或职场关系为目的"
    boundary_rules: [⑤, ⑫]
    subs:
      - id: D06-1
        name: 职业选择与发展
        definition: 职业选择、第一份工作、职业分级与发展路径、职业阶段与天花板。问：我的职业路怎么选、怎么走？
        includes: 职业选择与第一份工作（含工资的权衡）；五级工程师与职业发展；职业员工与管理者的分工与发展；35 岁等职业阶段议题；职业天花板；量级与职业发展；帝道、王道与霸道；面试与求职；转行与行业选择（职业视角）
        excludes_to: 升学、高考、大学选择 → X5；通用做事 → D05；企业经营 → D08；行业趋势预测 → X6 或 X2
        caliber_boundary: 结论句"以职业发展为目的"归本簇（⑤）
        material_clues: 见识第五章《23.年轻人第一份工作不要太在乎工资》《24.五级工程师和职业发展》《25.职场上的4个误区和4个破法》《26.职业员工和管理者要注意的两件事》《27.职业中的帝道、王道与霸道》《28.职场完美进阶：常识、科技和艺术》；格局《职场沟通从面试开始》《三种好公司和三种职场聪明人》；来信1 第 054 封《五级工程师和职业发展》；来信2 回用户信 01《为什么职业发展会面临"35岁危…》；谷歌《职业天花板来自认识的局限性》《量级和职业发展》
        must_check_topics:
          - ① 职业选择与第一份工作
          - ② 职业分级与发展路径
          - ③ 职业天花板与量级
          - ④ 职场误区与破解
          - ⑤ 面试与求职
        ability_tags: [做]
        risks: 重点三柱之一，深加工；领域直连内容多落在本簇和 D08
      - id: D06-2
        name: 职场效能
        definition: 在职场中把工作做出成果的方法与误区：伪工作与有效工作、目标管理、做好最后的 1%。问：怎样在职场里不做无效功、做出成果？
        includes: 伪工作者；努力 10000 小时的辨析；三板斧破四困境；OKR（职场场景）；做好最后的 1%（职场场景）；职场效率；远程办公的效率
