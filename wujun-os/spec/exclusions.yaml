# WJ-OS 排除准则字典（机读版）
# 权威来源：spec/v2_方案.md §5.12（排除准则 X1–X8）、constraints.md HC-09。
# 排除只能在读完"单元卡加首尾段"之后判定（§5.12 判定前置）。
# "含可迁移方法论则只抽方法论"的例外适用于 X2–X6（§5.12）。
# X 子类用于单元处置标签 X（§5.6：X=排除，必须有子类 X1–X8 和理由）。

meta:
  dictionary: WJ-OS 排除准则
  version: "v1.0"
  date: "2026-10-24"
  authoritative_source: "wujun-os/spec/v2_方案.md §5.12；constraints.md HC-09"
  judgment_prerequisite: 排除只能在读完"单元卡加首尾段"之后判定，不得凭标题预判
  methodology_exception: '"含可迁移方法论则只抽方法论"的例外适用于 X2–X6'
  pull_back_clause:
    rule: 游记、移民等默认排除，用户可点名拉回（HC-09、v2 §5.12）
    applies_to:
      - X3（游记，§5.12 明示）
      - 移民（HC-09 明示可拉回；但移民在 §5.12 未单列子类，暂按 X8 处置并逐条写理由，子类归属待用户确认）
    mechanism: 用户点名某具体单元或主题后，该单元按正常支柱归属流程处理；拉回动作记入台账与变更记录
    note: "含可迁移方法论的单元不整体拉回时，仍按'只抽方法论'处理，叙述部分留在排除侧"
  relation_to_n_class: "v2 §5.6 的 N 类（非内容/结构：N1 目录导航推广出版信息、N2 结构容器标题、N3 参照单元）与 X1 范围存在重叠（v2 内部未显式消解）；建议处置优先级：结构性载体单元记 N（只登记不抽取），读后判定的内容性载体（新书推荐、彩蛋、投票、招募等）记 X1——此消解口径待用户确认"

exclusions:
  - id: X1
    name: 载体与非内容
    criterion: 目录、导航、推广、出版信息、新书推荐、彩蛋、投票、招募
    examples:
      - 各书目录（本书内转载的《见识》目录同）
      - 导航区、出版信息页
      - 新书推荐、彩蛋、投票、招募页
    exceptions: 无
    default_action: 排除；结构性载体优先记 N 类（N1/N2/N3）只登记，内容性载体记 X1 并写理由
  - id: X2
    name: 时事与时点论断
    criterion: 依附具体时点、行情、事件、政策现状的论断，离开该时点即失效
    examples:
      - 具体行情与标的判断（某年某资产贵贱）
      - 针对当时新闻事件的评论
    exceptions: 提炼可迁移的判断逻辑，标稳定度；时效论断不入主干
    default_action: 排除时效论断本体；有可迁移判断逻辑则只抽逻辑并标稳定度（永恒原理/时效论断）
  - id: X3
    name: 游记与旅行
    criterion: 以行程、见闻、景观叙述为主体的内容
    examples:
      - 旅行见闻记叙
      - 参访游记的行程叙述部分
    exceptions: 含可迁移方法论则只抽方法论
    default_action: 默认排除；含可迁移方法论只抽方法论；用户可点名拉回
  - id: X4
    name: 纯史实科普
    criterion: 大学史、货币史、瓷器史、人物传记、航天史等纯史实与生平科普，无可迁移判断
    examples:
      - 数学史公案（如无理数公案，若纯史实则归此）
      - 企业史、人物史、技术史
    exceptions: 沿用既有决定：排除，仅留可迁移方法论
    default_action: 排除史实叙述；仅抽取可迁移方法论，标说话人与出处
  - id: X5
    name: 教育制度、升学、家庭与亲密关系
    criterion: 教育制度、升学、大学与专业选择；爱情、婚姻、亲子等家庭与亲密关系
    examples:
      - 高考志愿与大学选择（升学目的）
      - 亲子教育方法（含快乐教育）
      - 爱情与婚姻议题
    exceptions: 用户已定暂不需要；友情与社交不在此列（归 D07-2）；"如何学习"类方法论按规则⑪归 D02-2
    default_action: 排除；其中"如何学习"方法论按规则⑪归个人成长·如何学习
  - id: X6
    name: 宏观经济、科技趋势、文明历史
    criterion: 宏观经济预测、科技趋势预测、文明历史叙述、国家科研体制等
    examples:
      - 未来经济走向预测
      - AI 与科技趋势预测
      - 宏观收入分配、国家科研体制
    exceptions: 用户已定不作支柱；可迁移的判断逻辑归判断决策（D03）或商业（D08）
    default_action: 排除趋势预测与史述本体；可迁移判断逻辑归 D03 或 D08
  - id: X7
    name: 读者来信原文与第三方引文
    criterion: 读者来信原文、第三方引文（无吴军评述的部分）
    examples:
      - 读者来信原文正文
      - 无吴军评述的第三方观点引文
    exceptions: 吴军的回应或评述单独抽取，标说话人
    default_action: 排除原文；吴军回应/评述单独成卡并标"吴军本人"，第三方观点标"转述·第三方"
  - id: X8
    name: 其他
    criterion: 以上 X1–X7 均不适配、经读后判定应排除的内容（兜底类，从严使用）
    examples:
      - 医学与心理疾病诊断类内容
      - 学术写作规范
      - 纯赏析类文学人物内容（无结论句可归属时）
      - 没有可迁移判断的个人轶事残余
    exceptions: 须逐条写理由，抽样复核
    default_action: 排除；逐条写理由并进入抽样复核池
